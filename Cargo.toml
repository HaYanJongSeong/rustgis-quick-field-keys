[package]
name = "rustgis-quick-field-keys"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["HaYanJongSeong"]
homepage = "https://github.com/HaYanJongSeong/rustgis-quick-field-keys"
description = "Session-only guarded field presets for RustGIS"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustgis-plugin = { git = "https://github.com/opengeos/rustgis-plugins", rev = "fca6f3ad" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
